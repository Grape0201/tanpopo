[workspace]
members = [
    "crates/tanpopo-bm25",
    "crates/tanpopo-vector",
    "crates/tanpopo",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = "0.8"
async-trait = "0.1"
memmap2 = "0.9"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs", tag = "v0.7.0" }
tantivy = "0.27"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

tanpopo-bm25 = { path = "crates/tanpopo-bm25" }
tanpopo-vector = { path = "crates/tanpopo-vector" }
tanpopo = { path = "crates/tanpopo" }
