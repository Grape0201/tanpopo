<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanpopo UI</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #222; }
  header { background: #f5c400; padding: 8px 16px; font-weight: bold; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  nav button { padding: 6px 16px; border: 1px solid #ccc; background: #eee; cursor: pointer; }
  nav button.on { background: #fff; border-bottom-color: #fff; font-weight: bold; }
  section { background: #fff; border: 1px solid #ccc; padding: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
  input[type=text], textarea, select { padding: 6px; font: inherit; }
  input.q { flex: 1; min-width: 240px; }
  textarea { width: 100%; box-sizing: border-box; font-family: monospace; min-height: 120px; }
  button.go { padding: 6px 16px; }
  .hit { border-top: 1px solid #ddd; padding: 8px 0; }
  .meta { color: #666; font-size: 0.85em; }
  pre { background: #f4f4f4; padding: 8px; overflow: auto; margin: 4px 0; }
  .err { color: #b00020; }
  table { border-collapse: collapse; margin: 4px 0 12px; }
  td, th { border: 1px solid #ccc; padding: 2px 8px; text-align: left; }
  .badge { display: inline-block; padding: 1px 6px; font-size: 0.78em; background: #e6f4ea; color: #137333; border-radius: 3px; }
  .bar-wrap { width: 120px; background: #eee; height: 10px; display: inline-block; vertical-align: middle; margin-left: 6px; }
  .bar { height: 100%; background: #f5c400; }
</style>
</head>
<body>
<header>🌼 Tanpopo</header>
<main>
<nav>
  <button id="t-search" class="on">検索</button><button id="t-analyze">形態素解析</button><button id="t-inspect">インデックス可視化</button>
</nav>

<section id="p-search">
  <div class="row">
    <select id="index"></select>
    <input id="q" class="q" type="text" placeholder="検索クエリ（例: 空港）">
    <button id="go" class="go">検索</button>
  </div>
  <div class="row">
    <label>種別
      <select id="kind"><option>query_string</option><option>match</option></select>
    </label>
    <label>フィールド <input id="field" type="text" size="14" placeholder="match時は必須"></label>
    <label>size <input id="size" type="text" size="3" value="10"></label>
    <label>from <input id="from" type="text" size="3" value="0"></label>
  </div>
  <details>
    <summary>リクエスト JSON（編集して送信可）</summary>
    <textarea id="body"></textarea>
    <button id="raw" class="go">このJSONで検索</button>
  </details>
  <div id="summary" class="meta"></div>
  <div id="hits"></div>
</section>

<section id="p-analyze" hidden>
  <div class="row">
    <input id="text" class="q" type="text" value="関西国際空港に行く">
    <select id="mode"><option>A</option><option>B</option><option>C</option></select>
    <select id="form"><option>normalized</option><option>dictionary</option><option>surface</option></select>
    <button id="an" class="go">解析</button>
    <button id="abc" class="go">A/B/C 比較</button>
  </div>
  <div id="tokens"></div>
</section>

<section id="p-inspect" hidden>
  <div class="row">
    <select id="ins-index"></select>
    <select id="ins-field"><option value="_all">_all</option></select>
    <input id="ins-q" class="q" type="text" placeholder="トークン絞り込み（部分一致）">
    <label>件数 <select id="ins-limit"><option>100</option><option>200</option><option>500</option></select></label>
    <label><input id="ins-excl" type="checkbox"> ユーザ定義辞書を除外</label>
    <button id="ins-go" class="go">表示</button>
  </div>
  <details>
    <summary>マッピング構造</summary>
    <div id="ins-mapping"></div>
  </details>
  <div id="ins-summary" class="meta"></div>
  <div id="ins-terms"></div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const call = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(JSON.stringify(j));
  return j;
};
const el = (tag, text, cls) => {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
};

for (const t of ['search', 'analyze', 'inspect']) {
  $('t-' + t).onclick = () => {
    for (const u of ['search', 'analyze', 'inspect']) {
      $('p-' + u).hidden = u !== t;
      $('t-' + u).classList.toggle('on', u === t);
    }
    if (t === 'inspect' && $('ins-index').value) loadInspect();
  };
}

// ---- search ----
function buildBody() {
  const q = $('q').value, f = $('field').value.trim();
  let query;
  if (!q) query = { match_all: {} };
  else if ($('kind').value === 'match') query = { match: { [f]: q } };
  else query = { query_string: f ? { query: q, default_field: f } : { query: q } };
  return { query, size: +$('size').value || 10, from: +$('from').value || 0 };
}
async function run(body) {
  $('hits').replaceChildren(); $('summary').className = 'meta';
  try {
    const idx = $('index').value;
    const res = await call((idx ? '/' + encodeURIComponent(idx) : '') + '/_search', body);
    const total = res.hits.total.value;
    $('summary').textContent = `${total} 件 / ${res.took ?? '-'} ms`;
    for (const h of res.hits.hits) {
      const d = el('div', undefined, 'hit');
      d.append(el('div', `score ${h._score ?? '-'}  id ${h._id}  index ${h._index ?? ''}`, 'meta'),
               el('pre', JSON.stringify(h._source, null, 2)));
      $('hits').append(d);
    }
  } catch (e) { $('summary').className = 'err'; $('summary').textContent = e.message; }
}
$('go').onclick = () => { const b = buildBody(); $('body').value = JSON.stringify(b, null, 2); run(b); };
$('q').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('raw').onclick = () => {
  try { run(JSON.parse($('body').value)); }
  catch (e) { $('summary').className = 'err'; $('summary').textContent = e.message; }
};
(async () => {
  $('index').append(new Option('(全インデックス)', ''));
  try {
    for (const i of await call('/_cat/indices')) {
      $('index').append(new Option(`${i.index} (${i['docs.count']})`, i.index));
      $('ins-index').append(new Option(`${i.index} (${i['docs.count']})`, i.index));
    }
  } catch (e) { $('summary').textContent = e.message; }
})();

// ---- analyze ----
async function analyze(mode) {
  const res = await call('/_analyze', { text: $('text').value, mode, form: $('form').value });
  const box = el('div');
  box.append(el('b', `mode ${mode}`));
  const tbl = el('table');
  const toks = res.tokens || [];
  const keys = toks.length ? Object.keys(toks[0]) : [];
  const head = el('tr'); keys.forEach(k => head.append(el('th', k))); tbl.append(head);
  for (const t of toks) {
    const tr = el('tr'); keys.forEach(k => tr.append(el('td', String(t[k] ?? '')))); tbl.append(tr);
  }
  box.append(tbl);
  return box;
}
const showAnalyze = async modes => {
  $('tokens').replaceChildren();
  try { for (const m of modes) $('tokens').append(await analyze(m)); }
  catch (e) { $('tokens').append(el('div', e.message, 'err')); }
};
$('an').onclick = () => showAnalyze([$('mode').value]);
$('abc').onclick = () => showAnalyze(['A', 'B', 'C']);
$('text').onkeydown = e => { if (e.key === 'Enter') $('an').click(); };

// ---- inspect ----
async function loadMapping(idx) {
  const prev = $('ins-field').value;
  $('ins-field').replaceChildren(new Option('_all', '_all'));
  $('ins-mapping').replaceChildren();
  const res = await call('/' + encodeURIComponent(idx) + '/_mapping');
  const props = res?.[idx]?.mappings?.properties || {};
  const tbl = el('table');
  const head = el('tr');
  ['フィールド', '型', 'index analyzer', 'search analyzer'].forEach(h => head.append(el('th', h)));
  tbl.append(head);
  for (const [name, p] of Object.entries(props)) {
    const tr = el('tr');
    tr.append(el('td', name), el('td', p.type || ''), el('td', p.analyzer || '-'), el('td', p.search_analyzer || '-'));
    tbl.append(tr);
    if (p.type === 'text' || p.type === 'keyword') $('ins-field').append(new Option(name, name));
  }
  if ([...$('ins-field').options].some(o => o.value === prev)) $('ins-field').value = prev;
  $('ins-mapping').append(tbl);
}

async function loadTerms(idx) {
  $('ins-terms').replaceChildren();
  $('ins-summary').className = 'meta';
  const params = new URLSearchParams({
    field: $('ins-field').value || '_all',
    limit: $('ins-limit').value || '100',
    exclude_user_dict: String($('ins-excl').checked),
  });
  if ($('ins-q').value.trim()) params.set('q', $('ins-q').value.trim());
  const res = await call('/' + encodeURIComponent(idx) + '/_terms?' + params.toString());
  const exclInfo = res.excluded_user_dict_terms ? ` / ユーザ辞書除外: ${res.excluded_user_dict_terms} 件` : '';
  $('ins-summary').textContent = `ドキュメント数: ${res.total_docs} / ユニークトークン数: ${res.total_unique_terms}${exclInfo} / 表示: ${res.terms.length} 件`;
  const maxFreq = res.terms.reduce((m, t) => Math.max(m, t.doc_freq), 1);
  const tbl = el('table');
  const head = el('tr');
  ['#', 'トークン', '出現ドキュメント数', '辞書'].forEach(h => head.append(el('th', h)));
  tbl.append(head);
  res.terms.forEach((t, i) => {
    const tr = el('tr');
    const freqTd = el('td', String(t.doc_freq));
    const wrap = el('span', undefined, 'bar-wrap');
    const bar = el('div', undefined, 'bar');
    bar.style.width = Math.round((t.doc_freq / maxFreq) * 100) + '%';
    wrap.append(bar);
    freqTd.append(wrap);
    const dictTd = el('td');
    if (t.in_user_dict) dictTd.append(el('span', 'ユーザ辞書', 'badge'));
    else dictTd.textContent = '-';
    tr.append(el('td', String(i + 1)), el('td', t.term), freqTd, dictTd);
    tbl.append(tr);
  });
  $('ins-terms').append(tbl);
}

async function loadInspect(refreshMapping = true) {
  const idx = $('ins-index').value;
  if (!idx) { $('ins-summary').textContent = 'インデックスがありません'; return; }
  try {
    if (refreshMapping) await loadMapping(idx);
    await loadTerms(idx);
  } catch (e) { $('ins-summary').className = 'err'; $('ins-summary').textContent = e.message; }
}
$('ins-index').onchange = () => loadInspect(true);
$('ins-field').onchange = () => loadInspect(false);
$('ins-excl').onchange = () => loadInspect(false);
$('ins-limit').onchange = () => loadInspect(false);
$('ins-go').onclick = () => loadInspect(false);
$('ins-q').onkeydown = e => { if (e.key === 'Enter') loadInspect(false); };
</script>
</body>
</html>
